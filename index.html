<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Lost & Found</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif}
.card:hover{transform:translateY(-5px); box-shadow:0 20px 30px rgba(0,0,0,0.15)}
</style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen">

<!-- Header -->
<header class="bg-white/80 backdrop-blur-md shadow-lg sticky top-0 z-50">
<div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
<h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-pink-500 bg-clip-text text-transparent">🎒 College Lost & Found</h1>
<button onclick="document.getElementById('formDiv').classList.toggle('hidden')" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-6 py-2 rounded-full font-semibold hover:scale-105 transition">+ Post Item</button>
</div>
</header>

<!-- Hero -->
<div class="max-w-6xl mx-auto px-6 mt-8">
<div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-3xl p-8 text-white text-center shadow-2xl">
<h2 class="text-4xl font-bold mb-2">Lost Something on Campus?</h2>
<p class="opacity-90 mb-6">Post it here and help each other find it back!</p>
<input id="search" onkeyup="filterItems()" placeholder="🔍 Search items (e.g. calculator, ID card...)" class="w-full max-w-xl mx-auto px-6 py-3 rounded-full text-gray-800 outline-none shadow-lg">
</div>
</div>

<!-- Post Form -->
<div id="formDiv" class="hidden max-w-2xl mx-auto mt-8 px-6">
<div class="bg-white rounded-2xl p-6 shadow-xl">
<h3 class="font-bold text-lg mb-4">Post Lost Item</h3>
<input id="name" placeholder="Item Name (e.g. Calculator)" class="w-full border-2 border-indigo-100 rounded-xl px-4 py-3 mb-3 focus:border-indigo-500 outline-none">
<input id="location" placeholder="Lost Location (e.g. Near Library)" class="w-full border-2 border-indigo-100 rounded-xl px-4 py-3 mb-3 focus:border-indigo-500 outline-none">
<input id="contact" placeholder="Your Contact (Phone / Email)" class="w-full border-2 border-indigo-100 rounded-xl px-4 py-3 mb-4 focus:border-indigo-500 outline-none">
<button onclick="postItem()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-xl font-bold hover:opacity-90">Post Now 🚀</button>
</div>
</div>

<!-- Items -->
<div class="max-w-6xl mx-auto px-6 mt-10">
<h3 class="text-xl font-bold mb-4">📦 All Lost Items (<span id="count">0</span>)</h3>
<div id="items" class="grid md:grid-cols-3 gap-6 pb-10"></div>
</div>

<script>
let allItems = [];
async function loadItems(){
 let res = await fetch('/api/items');
 allItems = await res.json();
 display(allItems);
}
function display(items){
 document.getElementById('count').innerText = items.length;
 let html = '';
 if(items.length==0) html = '<p class="col-span-3 text-center text-gray-500 py-10">No items yet. Be the first to post! 😊</p>';
 items.reverse().forEach(item=>{
   html += `
   <div class="card bg-white rounded-2xl p-5 shadow-lg transition-all duration-300 border border-white">
     <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-pink-500 rounded-xl flex items-center justify-center text-white text-xl mb-4">🎒</div>
     <h4 class="font-bold text-lg capitalize">${item.name || item.item || 'Item'}</h4>
     <p class="text-gray-500 text-sm mt-1">📍 ${item.location || item.place || 'Campus'}</p>
     <div class="mt-4 bg-indigo-50 rounded-xl px-3 py-2 flex justify-between items-center">
       <span class="text-sm text-indigo-700">📞 ${item.contact || item.phone || ''}</span>
       <span class="text-xs bg-green-200 text-green-700 px-2 py-1 rounded-full">LOST</span>
     </div>
   </div>`;
 });
 document.getElementById('items').innerHTML = html;
}
async function postItem(){
 let name = document.getElementById('name').value;
 let location = document.getElementById('location').value;
 let contact = document.getElementById('contact').value;
 if(!name || !location || !contact) return alert('Fill all fields!');
 await fetch('/api/items', {
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body: JSON.stringify({name, location, contact})
 });
 document.getElementById('name').value=''; document.getElementById('location').value=''; document.getElementById('contact').value='';
 document.getElementById('formDiv').classList.add('hidden');
 loadItems();
}
function filterItems(){
 let q = document.getElementById('search').value.toLowerCase();
 let filtered = allItems.filter(i => (i.name||'').toLowerCase().includes(q) || (i.location||'').toLowerCase().includes(q));
 display(filtered);
}
loadItems();
</script>
</body>
</html>
